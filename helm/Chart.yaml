apiVersion: v2
name: open-dmarc-analyzer
description: Open DMARC Analyzer is an Open Source DMARC Report Analyzer to be used with DMARC reports that have been parsed by Open Report Parser.
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://github.com/userjack6880/Open-DMARC-Analyzer
dependencies:
  - name: ingress-nginx # https://artifacthub.io/packages/helm/ingress-nginx/ingress-nginx
    version: ~4.11.3
    repository: "https://kubernetes.github.io/ingress-nginx"
    condition: ingress.enabled